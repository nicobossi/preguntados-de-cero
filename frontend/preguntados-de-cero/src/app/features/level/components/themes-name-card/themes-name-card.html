<section>
  <article
    class="glass-container"
    (animationend)="onOffAnimation()">
    <div
      class="card"
      [class]="cardClass()">
      <header>Tematicas</header>
      <div class="theme-names-container">
        <ul>
          @for(theme of themes(); track theme.id) {
            <li class="theme-name-item">{{theme.name}}</li>
          }
        </ul>
      </div>
    </div>
  </article>
</section>
