<section>
  <article
    (animationend)="onOffAnimation()">
    <div
      class="card"
      [class]="cardClass()">
      <header>Tematicas</header>
      <div class="theme-names-container">
        <ul>
          @for(theme of themeNames(); track theme) {
            <li class="theme-name-item">{{theme}}</li>
          }
        </ul>
      </div>
    </div>
  </article>
</section>
