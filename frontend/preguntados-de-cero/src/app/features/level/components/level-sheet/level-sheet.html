<article
  (animationend)="onFinishAnimation()"
  [class]="articleClass()">
    <div
      (mouseenter)="onHover()"
      (mouseleave)="onHover()"
      class="card-container">
      <div class="card" [class]="cardClass()">
        <app-level-header [level]="difficulty().level" />
        <app-theme-names-container [themeNames]="difficulty().themeNames" [isHover]="isHover()" />
        <app-level-button (navegate)="navegate()"/>
      </div>
    </div>
  </article>
